<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>See N Say Storymaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1> See N Say Storymaker</h1>

  <p class="instructions">
    Click each button to cycle through words.
    When you’re happy, click <strong>Tell My Story</strong>.
  </p>

    <!-- Word selection buttons -->
  <div class="controls">
    <button id="part1">The funny dog</button>
    <button id="part2">jumped over</button>
    <button id="part3">the big fence</button>
    <button id="part4">because it saw</button>
    <button id="part5">a flying cat</button>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button id="tellStory">📖 Tell My Story</button>
    <button id="randomStory">🎲 Random Story</button>
    <button id="reset">🔄 Reset</button>
  </div>

  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
